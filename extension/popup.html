<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corner Spotter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container" id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="6"></circle>
            <circle cx="12" cy="12" r="2"></circle>
          </svg>
        </div>
        <div class="header-text">
          <h1>CORNER SPOTTER</h1>
          <span>Bet365 Analysis</span>
        </div>
      </div>
      <div class="status-badge" id="status-badge">
        <span class="status-dot"></span>
        <span>Online</span>
      </div>
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="signals">Sinais</button>
      <button class="tab" data-tab="config">Config</button>
    </div>

    <!-- Signals Tab -->
    <div class="tab-content active" id="signals-tab">
      <div class="scan-section">
        <button class="btn-scan" id="scan-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 11-6.219-8.56"/>
          </svg>
          <span>Analisar Página</span>
        </button>
        <div class="scan-info">
          <span id="last-scan">Não analisado</span>
        </div>
      </div>

      <div class="signals-list" id="signals-list">
        <div class="empty-state" id="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <p>Nenhum sinal encontrado</p>
          <span>Navegue até uma partida na Bet365 e clique em "Analisar Página"</span>
        </div>
      </div>
    </div>

    <!-- Config Tab -->
    <div class="tab-content" id="config-tab">
      <div class="config-section">
        <h3>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          Telegram
        </h3>
        
        <div class="input-group">
          <label>Bot Token</label>
          <input type="password" id="bot-token" placeholder="123456789:ABC...">
        </div>
        
        <div class="input-group">
          <label>Chat ID</label>
          <input type="text" id="chat-id" placeholder="-1001234567890">
        </div>

        <div class="toggle-group">
          <span>Telegram Ativo</span>
          <button class="toggle active" id="telegram-enabled">
            <div class="toggle-handle"></div>
          </button>
        </div>

        <div class="btn-group">
          <button class="btn-secondary" id="test-telegram">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            Testar
          </button>
          <button class="btn-primary" id="save-telegram">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Salvar
          </button>
        </div>
      </div>

      <div class="config-section">
        <h3>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          Análise
        </h3>

        <div class="input-group">
          <label>Probabilidade Mínima (%)</label>
          <input type="number" id="min-probability" value="60" min="0" max="100" step="5">
        </div>

        <div class="input-row">
          <div class="input-group">
            <label>Odds Mín</label>
            <input type="number" id="min-odds" value="1.20" min="1" step="0.05">
          </div>
          <div class="input-group">
            <label>Odds Máx</label>
            <input type="number" id="max-odds" value="2.50" min="1" step="0.05">
          </div>
        </div>

        <div class="toggle-group">
          <span>Auto enviar Telegram</span>
          <button class="toggle active" id="auto-telegram">
            <div class="toggle-handle"></div>
          </button>
        </div>

        <div class="toggle-group">
          <span>Analisar Ao Vivo</span>
          <button class="toggle active" id="analyze-live">
            <div class="toggle-handle"></div>
          </button>
        </div>

        <div class="toggle-group">
          <span>Analisar Pré-Jogo</span>
          <button class="toggle active" id="analyze-prematch">
            <div class="toggle-handle"></div>
          </button>
        </div>

        <button class="btn-primary w-full" id="save-settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Salvar Configurações
        </button>
      </div>

      <div class="config-section">
        <h3>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          API
        </h3>
        
        <div class="input-group">
          <label>URL do Backend</label>
          <input type="text" id="api-url" placeholder="https://seu-servidor.com">
        </div>

        <button class="btn-secondary w-full" id="test-api">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          Testar Conexão
        </button>
      </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
